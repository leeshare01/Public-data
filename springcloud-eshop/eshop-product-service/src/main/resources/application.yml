server:
  port: 8082

spring:
  application:
    name: eshop-product-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eshop_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 商品图片静态资源目录（/images/** 映射）
# 默认指向仓库内 frontend/public/images（从 springcloud-eshop/ 目录启动时向上一级）
# 若启动目录不同，请改为绝对路径，例如：file:/data/eshop/images/
eshop:
  images:
    location: file:../frontend/public/images/
